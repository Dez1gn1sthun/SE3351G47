<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Western Engineering · 3D Campus</title>
    <meta
      name="description"
      content="Orbit Western University's engineering buildings in 3D, then step inside ACEB 1420 through a LiDAR scan."
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive 3D model of Western University's engineering buildings"></canvas>

    <!-- Anchor for the `sign` empty: a zero-size point positioned by projection. -->
    <div
      id="sign"
      class="sign"
      role="button"
      tabindex="0"
      hidden
      aria-label="Open the LiDAR scan of room ACEB 1420"
    >
      <span class="sign__dot" aria-hidden="true"></span>
      <span class="sign__stem" aria-hidden="true"></span>
      <span class="sign__card">
        <span class="sign__kicker">LiDAR scan</span>
        <span class="sign__title">ACEB 1420</span>
        <span class="sign__hint">
          Click to step inside
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" />
          </svg>
        </span>
      </span>
    </div>

    <header id="hud" class="hud" hidden>
      <a class="hud__home" href="./">← Back to start</a>
      <h1>Western Engineering</h1>
      <p>Drag to orbit · Scroll to zoom · WASD move</p>
    </header>

    <div id="room-bar" class="roombar" hidden>
      <button id="back" class="roombar__back" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M13 8H4M7.5 4.5 4 8l3.5 3.5" />
        </svg>
        Campus
      </button>
      <div class="roombar__meta">
        <strong id="room-title"></strong>
        <span id="room-kicker"></span>
      </div>
    </div>

    <p id="room-hint" class="roomhint" hidden>Drag to look around · Scroll to move · WASD move · M explore · I nearest point</p>

    <!-- Room tour (RoomTour.ts): information points, Explore menu, minimap. -->
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="poi-markers" class="poi-layer" hidden></div>
    <button id="explore-btn" class="explore-btn" type="button" aria-expanded="false" aria-controls="explore-panel" hidden>Explore</button>
    <aside id="explore-panel" class="panel" hidden aria-labelledby="explore-title">
      <div class="panel__head">
        <h2 id="explore-title">Explore ACEB 1420</h2>
        <button class="panel__close" type="button" data-close aria-label="Close the Explore menu">✕</button>
      </div>
      <h3>Go to</h3>
      <ul id="jump-list" class="panel__list"></ul>
      <h3>Points of interest</h3>
      <ul id="poi-list" class="panel__list"></ul>
    </aside>
    <aside id="info-panel" class="panel panel--info" hidden role="dialog" aria-modal="false" aria-labelledby="info-title">
      <div class="panel__head">
        <h2 id="info-title"></h2>
        <button class="panel__close" type="button" data-close aria-label="Close information panel">✕</button>
      </div>
      <img id="info-img" alt="" hidden />
      <p id="info-text"></p>
    </aside>
    <figure id="minimap-wrap" class="minimap" hidden>
      <canvas id="minimap" width="150" height="168" role="img" aria-label="Plan of ACEB 1420 showing where you are"></canvas>
      <figcaption>ACEB 1420 · you are here</figcaption>
    </figure>

    <!-- Dev only: node names drawn on screen for `?nodes` (see CampusView.ts). -->
    <div id="node-debug"></div>

    <div id="loader" class="loader">
      <div class="loader__inner">
        <p id="loader-label" class="loader__label">Loading campus</p>
        <div class="loader__track" role="progressbar" aria-labelledby="loader-label">
          <i id="loader-fill"></i>
        </div>
        <p id="loader-pct" class="loader__pct"></p>
        <p id="loader-error" class="loader__error" hidden></p>
        <button id="retry" class="loader__retry" type="button" hidden>Retry</button>
      </div>
    </div>

    <noscript>
      <p class="noscript">This page needs JavaScript to render the 3D campus.</p>
    </noscript>

    <script type="module" src="./src/campus/main.ts"></script>
  </body>
</html>
